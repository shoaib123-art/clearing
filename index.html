    const box = fin.querySelector("[data-after]"); box.innerHTML = "";
    const felt = EMO_LOG.filter(e=> d.emo[e.id].before > 0);
    box.appendChild(el(`<label class="fl">How do you feel now?</label>`));
    if(!felt.length) box.appendChild(el(`<p class="muted">You didn't rate any feelings at the start, so there's nothing to compare — you can still save the thoughts.</p>`));
    felt.forEach(e=>{ d.emo[e.id].after = d.emo[e.id].before; box.appendChild(slider(e.name+" (was "+d.emo[e.id].before+")", d.emo[e.id].before, v=> d.emo[e.id].after = v)); });
    box.appendChild(el(`<hr class="sep">`));
    box.appendChild(el(`<label class="fl">How much do you believe each original thought now?</label>`));
    ts.forEach(t=>{ t.after = t.before; box.appendChild(slider("“"+t.text.slice(0,60)+(t.text.length>60?"…":"")+"” (was "+t.before+")", t.before, v=> t.after = v)); });
    const sv = el(`<button class="btn" style="margin-top:8px">Save to my journal</button>`);
    sv.onclick = ()=>{
      const id = uid(), stamp = Date.now();
      const entry = {id, ts:stamp, date:today(), event:d.event.trim(),
        emotions: felt.map(e=>({id:e.id, name:e.name, before:d.emo[e.id].before, after:d.emo[e.id].after})),
        thoughts: ts.map(t=>({text:t.text.trim(), before:t.before, after:t.after, dist:t.dist.slice(), pos:t.pos.trim(), posBelief:t.posBelief}))};
      S.logs.unshift(entry);
      entry.thoughts.forEach(t=> S.records.unshift({id:uid(), ts:stamp, date:today(), thought:t.text, before:t.before, after:t.after,
        distortions:t.dist.map(x=>({id:x, name:dname(x)})), reframe:t.pos, core:null}));
      save();
      onSaved(id);
    };
    box.appendChild(sv);
    sv.scrollIntoView({behavior:"smooth", block:"center"});
  };
  c.appendChild(fin);
  return c;
}

function moodHistory(openId){
  const c = el(`<div></div>`);
  if(!S.logs.length){
    c.appendChild(el(`<div class="card flat"><div class="empty"><p>No mood logs yet. Complete one and it will be kept here, so you can look back at how a bad moment shifted.</p><button class="btn">Start a mood log</button></div></div>`));
    c.querySelector("button").onclick = ()=> go("journal", {tab:"mood"});
    return c;
  }
  S.logs.forEach(L=>{
    const drops = L.emotions.map(e=> e.before - e.after);
    const avg = drops.length ? Math.round(drops.reduce((a,b)=>a+b,0)/drops.length) : null;
    const title = (L.event || (L.thoughts[0] && L.thoughts[0].text) || "Mood log").slice(0,70);
    const det = el(`<details class="method" ${L.id===openId?"open":""}><summary>${esc(fmt(L.ts))} — ${esc(title)}${avg!=null?` <span class="tag ${avg>0?"calm":""}" style="margin-left:6px">${avg>0?"feeling −"+avg:avg<0?"feeling +"+(-avg):"no change"}</span>`:""}</summary><div style="margin-top:12px"></div></details>`);
    const body = det.querySelector("div");
    if(L.event) body.appendChild(el(`<p class="muted" style="margin:0 0 10px">${esc(L.event)}</p>`));
    L.emotions.forEach(e=> body.appendChild(el(`<div class="spread" style="font-size:14px;margin-bottom:4px"><span>${esc(e.name)}</span><span class="muted">${e.before} → ${e.after}</span></div>`)));
    L.thoughts.forEach(t=> body.appendChild(el(`<div class="list-item" style="margin-top:10px">
      <blockquote class="quote" style="font-size:16px;margin-bottom:8px">${esc(t.text)}</blockquote>
      <div class="row" style="margin-bottom:8px">${t.dist.map(x=>`<span class="tag">${esc(dname(x))}</span>`).join("")}<span class="muted">belief ${t.before} → ${t.after}</span></div>
      ${t.pos ? `<p class="serifbody" style="margin:0;color:var(--ink-2)">${esc(t.pos)}</p>` : ""}</div>`)));
    const del = el(`<button class="btn quiet sm" style="margin-top:10px;color:var(--hot)">Delete this entry</button>`);
    del.onclick = ()=>{ if(!confirm("Delete this mood log?")) return; S.logs = S.logs.filter(x=>x.id!==L.id); save(); go("journal",{tab:"history"}); };
    body.appendChild(del);
    c.appendChild(det);
  });
  return c;
}

function procrView(){
  const c = el(`<div></div>`);
  c.appendChild(el(`<div class="card"><h2>The anti-procrastination sheet</h2>
    <p style="margin:0">Procrastination is mostly a forecasting error. You predict the task will be miserable and the payoff small, so you wait for a better mood. The sheet fixes the forecast: break the task small, answer the excuses in writing, predict, do one piece, then compare prediction with reality.</p></div>`));

  const d = {task:"", tics:[{tic:"", toc:""}], steps:[{text:"",pd:50,ps:30},{text:"",pd:50,ps:30},{text:"",pd:50,ps:30}]};
  const form = el(`<div class="card"><h2>New sheet</h2>
    <label class="fl">The task I'm avoiding</label>
    <textarea rows="2" data-task placeholder="File my tax return"></textarea>
    <hr class="sep"><h3>My excuses — and honest answers</h3>
    <p class="muted" style="margin-bottom:12px">Write what your mind says to get you off the hook, then a reply that's true and points back toward the task.</p>
    <div data-tics></div><button class="btn ghost sm" data-addtic>+ Another excuse</button>
    <hr class="sep"><h3>Small steps</h3>
    <p class="muted" style="margin-bottom:12px">Make each step small enough to start in the next five minutes. Predict how hard it will be and how satisfying, 0 to 100.</p>
    <div data-steps></div><button class="btn ghost sm" data-addstep>+ Another step</button>
    <div style="margin-top:18px"><button class="btn" data-save>Save this sheet</button></div></div>`);
  const taskEl = form.querySelector("[data-task]");
  taskEl.oninput = ()=> d.task = taskEl.value;

  const ticBox = form.querySelector("[data-tics]");
  const drawTics = ()=>{
    ticBox.innerHTML = "";
    d.tics.forEach((x,i)=>{
      const r = el(`<div class="list-item"><label class="fl">Excuse ${i+1}</label>
        <textarea rows="2" data-a placeholder="I don't feel like it right now."></textarea>
        <label class="fl" style="margin-top:10px">Honest answer</label>
        <textarea rows="2" data-b placeholder="Feeling like it usually comes after I start, not before."></textarea>
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-ai>Answer it back</button>${d.tics.length>1?`<button class="btn quiet sm" data-rm>Remove</button>`:""}</div>
        <div data-out style="margin-top:8px"></div></div>`);
      const a = r.querySelector("[data-a]"), b = r.querySelector("[data-b]"), out = r.querySelector("[data-out]");
      a.value = x.tic; b.value = x.toc;
      a.oninput = ()=> x.tic = a.value; b.oninput = ()=> x.toc = b.value;
      const rm = r.querySelector("[data-rm]"); if(rm) rm.onclick = ()=>{ d.tics.splice(i,1); drawTics(); };
      r.querySelector("[data-ai]").onclick = async ev=>{
        const btn = ev.currentTarget;
        if(!x.tic.trim()){ a.focus(); return; }
        out.innerHTML = "";
        if(!AI){ out.appendChild(el(`<div class="notice">${esc(aiMsg("not_granted"))}</div>`)); return; }
        btn.disabled = true; out.appendChild(thinkingEl("Thinking…"));
        try{
          const j = await AI.json(`A user is procrastinating on: "${d.task || "a task"}". Their excuse: "${x.tic}". Reply with ONLY JSON {"reply":"<one or two sentences, first person, honest and specific, pointing back toward starting the task — no cheerleading, no guilt>"}`);
          out.innerHTML = "";
          if(j.reply){ b.value = j.reply; x.toc = j.reply; }
        }catch(err){ out.innerHTML = ""; out.appendChild(aiErrorCard(err)); }
        btn.disabled = false;
      };
      ticBox.appendChild(r);
    });
  };
  form.querySelector("[data-addtic]").onclick = ()=>{ d.tics.push({tic:"",toc:""}); drawTics(); };
  drawTics();

  const stepBox = form.querySelector("[data-steps]");
  const drawSteps = ()=>{
    stepBox.innerHTML = "";
    d.steps.forEach((s,i)=>{
      const r = el(`<div class="list-item"><div class="spread" style="gap:8px"><input type="text" data-t placeholder="Step ${i+1} — e.g. find last year's forms" style="flex:1">${d.steps.length>1?`<button class="btn quiet sm" data-rm>✕</button>`:""}</div>
        <div class="grid2" style="margin-top:10px"><div data-pd></div><div data-ps></div></div></div>`);
      const t = r.querySelector("[data-t]"); t.value = s.text; t.oninput = ()=> s.text = t.value;
      r.querySelector("[data-pd]").appendChild(slider("Predicted difficulty", s.pd, v=> s.pd = v));
      r.querySelector("[data-ps]").appendChild(slider("Predicted satisfaction", s.ps, v=> s.ps = v));
      const rm = r.querySelector("[data-rm]"); if(rm) rm.onclick = ()=>{ d.steps.splice(i,1); drawSteps(); };
      stepBox.appendChild(r);
    });
  };
  form.querySelector("[data-addstep]").onclick = ()=>{ d.steps.push({text:"",pd:50,ps:30}); drawSteps(); };
  drawSteps();

  form.querySelector("[data-save]").onclick = ()=>{
    const steps = d.steps.filter(s=> s.text.trim());
    if(!d.task.trim()){ taskEl.focus(); return; }
    if(!steps.length){ const f = stepBox.querySelector("[data-t]"); f && f.focus(); return; }
    S.procr.unshift({id:uid(), ts:Date.now(), task:d.task.trim(),
      tics:d.tics.filter(x=>x.tic.trim()).map(x=>({tic:x.tic.trim(), toc:x.toc.trim()})),
      steps:steps.map(s=>({id:uid(), text:s.text.trim(), pd:s.pd, ps:s.ps, done:false}))});
    save(); go("journal", {tab:"procr"});
  };
  c.appendChild(form);

  S.procr.forEach(P=>{
    const done = P.steps.filter(s=>s.done);
    const card = el(`<div class="card"><div class="card-hd"><div><h2>${esc(P.task)}</h2>
      <p class="muted" style="margin:0">${done.length} of ${P.steps.length} steps done · started ${esc(fmt(P.ts))}</p></div>
      <button class="btn quiet sm" data-del title="Delete sheet">✕</button></div><div data-body></div></div>`);
    const body = card.querySelector("[data-body]");
    if(P.tics.length){
      const dt = el(`<details class="method"><summary>My excuses and answers</summary><div style="margin-top:10px"></div></details>`);
      P.tics.forEach(x=> dt.querySelector("div").appendChild(el(`<p style="margin:0 0 10px;font-size:14.5px"><b>${esc(x.tic)}</b><br><span class="muted">${esc(x.toc || "—")}</span></p>`)));
      body.appendChild(dt);
    }
    P.steps.forEach(s=>{
      const row = el(`<div class="list-item"><div class="spread"><div style="min-width:0"><b style="font-weight:600">${esc(s.text)}</b>
        <div class="muted">${s.done ? `predicted ${s.pd}/${s.ps} → actual ${s.ad}/${s.as} (difficulty / satisfaction)` : `predicted difficulty ${s.pd}, satisfaction ${s.ps}`}</div></div>
        ${s.done ? `<span class="tag calm">done</span>` : `<button class="btn sm ghost">I did it</button>`}</div><div data-rate hidden style="margin-top:12px"></div></div>`);
      const b = row.querySelector("button");
      if(b) b.onclick = ()=>{
        const rate = row.querySelector("[data-rate]"); if(!rate.hidden) return;
        rate.hidden = false;
        let ad = s.pd, as_ = s.ps;
        rate.appendChild(el(`<label class="fl">How was it, actually?</label>`));
        rate.appendChild(slider("Actual difficulty", s.pd, v=> ad = v));
        rate.appendChild(slider("Actual satisfaction", s.ps, v=> as_ = v));
        const sv = el(`<button class="btn sm">Save</button>`);
        sv.onclick = ()=>{ s.done = true; s.ad = ad; s.as = as_; save(); go("journal",{tab:"procr"}); };
        rate.appendChild(sv);
      };
      body.appendChild(row);
    });
    if(done.length){
      const dd = Math.round(done.reduce((a,s)=>a+(s.pd-s.ad),0)/done.length);
      const ds = Math.round(done.reduce((a,s)=>a+(s.as-s.ps),0)/done.length);
      body.appendChild(el(`<p class="muted" style="margin:6px 0 0">So far: steps came out <b>${Math.abs(dd)} points ${dd>=0?"easier":"harder"}</b> and <b>${Math.abs(ds)} points ${ds>=0?"more":"less"} satisfying</b> than predicted.${dd>0||ds>0?" That gap is the finding — the forecast was too gloomy.":""}</p>`));
    }
    card.querySelector("[data-del]").onclick = ()=>{ if(!confirm("Delete this sheet?")) return; S.procr = S.procr.filter(x=>x.id!==P.id); save(); go("journal",{tab:"procr"}); };
    c.appendChild(card);
  });
  return c;
}

function trendChart(list, max){
  const W=560, H=150, P={t:10,r:12,b:22,l:28};
  const n = list.length, span = Math.max(1, n-1);
  const x = i => P.l + (n===1 ? (W-P.l-P.r)/2 : i/span*(W-P.l-P.r));
  const y = v => P.t + (1 - v/max) * (H-P.t-P.b);
  const path = list.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score history">
    ${[0,.25,.5,.75,1].map(f=>{ const v = Math.round(max*f); return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" font-size="10" fill="var(--ink-3)" text-anchor="end">${v}</text>`; }).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${list.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.score)}" r="3.6" fill="var(--accent)"/>`).join("")}
  </svg>`;
}

let checkTab = "phq9";
SCREENS.checkin = (arg)=>{
  if(arg && arg.tab) checkTab = arg.tab;
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>Check-in</h1>`));
  c.appendChild(el(`<p class="lede">A short self-assessment for low mood or anxiety, scored in the standard way, with a plain-language explanation of what the number means. Repeat it every couple of weeks to see whether what you're doing is working.</p>`));
  const body = el(`<div></div>`);
  const draw = ()=>{
    const old = c.querySelector(".tabs"); if(old) old.remove();
    c.insertBefore(tabBar([["phq9","Depression (PHQ-9)"],["gad7","Anxiety (GAD-7)"]], checkTab, id=>{ checkTab = id; draw(); }), body);
    body.innerHTML = "";
    body.appendChild(checkForm(checkTab));
  };
  c.appendChild(body);
  draw();
  return c;
};

function checkForm(key){
  const T = TESTS[key];
  const c = el(`<div></div>`);
  const ans = new Array(T.items.length).fill(null);
  const form = el(`<div></div>`);
  const hist = S.assess.filter(a=>a.type===key).slice().sort((a,b)=>a.ts-b.ts);
  if(hist.length){
    const last = hist[hist.length-1], b = bandFor(T, last.score);
    c.appendChild(el(`<div class="notice">Your last ${esc(T.full)}: <b>${last.score} of ${T.max}</b> (${esc(b.label)}) on ${esc(fmt(last.ts))}.</div>`));
  }
  form.appendChild(el(`<p class="serifbody" style="margin-bottom:14px">Over the last two weeks, how often have you been bothered by the following?</p>`));
  const prog = el(`<p class="muted" style="margin:0 0 14px">0 of ${T.items.length} answered</p>`);
  form.appendChild(prog);
  const submit = el(`<button class="btn" disabled>See my result</button>`);
  T.items.forEach((q,i)=>{
    const card = el(`<div class="card"><div class="qn">QUESTION ${i+1} OF ${T.items.length}</div><p style="margin:0 0 12px;font-weight:500">${esc(q)}</p><div class="opts four"></div></div>`);
    const wrap = card.querySelector(".opts");
    FREQ.forEach(([label,val])=>{
      const b = el(`<button class="opt" aria-pressed="false">${esc(label)}</button>`);
      b.onclick = ()=>{
        ans[i] = val;
        wrap.querySelectorAll("button").forEach(x=> x.setAttribute("aria-pressed", String(x===b)));
        const n = ans.filter(a=>a!==null).length;
        prog.textContent = n + " of " + T.items.length + " answered";
        submit.disabled = n < T.items.length;
      };
      wrap.appendChild(b);
    });
    form.appendChild(card);
  });
  form.appendChild(submit);
  form.appendChild(el(`<p class="muted" style="margin-top:14px">${esc(T.full)} was developed by Drs. Spitzer, Williams, Kroenke and colleagues and is free to use. It's a screening tool, not a diagnosis.</p>`));
  submit.onclick = ()=>{
    if(ans.some(a=>a===null)) return;
    const score = ans.reduce((a,b)=>a+b, 0);
    S.assess.push({id:uid(), ts:Date.now(), type:key, score, items:ans.slice()});
    save();
    c.innerHTML = "";
    c.appendChild(checkResult(key, score, ans, hist));
    window.scrollTo({top:0, behavior:"instant"});
  };
  c.appendChild(form);
  return c;
}

function checkResult(key, score, ans, prevList){
  const T = TESTS[key], b = bandFor(T, score);
  const c = el(`<div></div>`);
  if(key==="phq9" && ans[8] > 0){
    c.appendChild(crisisCard());
  }
  const prev = prevList.length ? prevList[prevList.length-1] : null;
  const delta = prev ? score - prev.score : null;
  const card = el(`<div class="card"><p class="eyebrow">${esc(T.name)} · ${esc(T.full)}</p>
    <div class="score"><b>${score}</b><span>out of ${T.max}</span><span class="tag ${b.tone}">${esc(b.label)}</span></div>
    <div class="belief-bar"><i style="width:${(score/T.max*100).toFixed(0)}%"></i></div>
    <p style="margin:14px 0 0">${esc(b.text)}</p>
    ${delta!==null ? `<hr class="sep"><p style="margin:0"><b>Since last time:</b> ${delta===0?"no change":(delta<0?"down ":"up ")+Math.abs(delta)+" points"} (was ${prev.score}). ${Math.abs(delta)>=5 ? "A change of about five points or more is usually considered meaningful." : "Changes of less than about five points are within normal week-to-week variation."}</p>` : ""}
  </div>`);
  c.appendChild(card);

  const nx = el(`<div class="card"><h2>What helps from here</h2><div class="row" data-n></div>
    <p class="muted" style="margin:14px 0 0">${score >= (key==="phq9" ? 10 : 10) ? "At this score, a conversation with a doctor or counsellor is worth having alongside the self-help tools. Find a helpline or service for your country at <a href=\"https://findahelpline.com\" target=\"_blank\" rel=\"noopener\">findahelpline.com</a>." : "Re-take this in about two weeks. A downward trend means what you're doing is working; a flat or rising one is a reason to change approach or add support."}</p></div>`);
  T.next.forEach(([label,to])=>{ const bt = el(`<button class="btn ghost sm">${esc(label)}</button>`); bt.onclick = ()=> go(to); nx.querySelector("[data-n]").appendChild(bt); });
  const ch = el(`<button class="btn ghost sm">Talk it through</button>`); ch.onclick = ()=> go("chat"); nx.querySelector("[data-n]").appendChild(ch);
  c.appendChild(nx);

  const all = S.assess.filter(a=>a.type===key).slice().sort((a,b2)=>a.ts-b2.ts);
  if(all.length > 1){
    const t = el(`<div class="card"><h2>Your scores over time</h2><p class="muted" style="margin-bottom:10px">Lower is better. Each point is one check-in.</p>${trendChart(all, T.max)}</div>`);
    c.appendChild(t);
  }
  const again = el(`<button class="btn quiet">‹ Back</button>`); again.onclick = ()=> go("checkin", {tab:key});
  c.appendChild(again);
  c.appendChild(el(`<p class="muted" style="margin-top:10px">A score is a snapshot, not a verdict, and not a diagnosis. Only a clinician who knows your history can diagnose.</p>`));
  return c;
}

/* ═══ SCREEN: Chat ══════════════════════════════════════ */
const STARTERS = [
 "I made a mistake at work and I can't stop thinking about it.",
 "I feel like I'm a failure.",
 "Help me with a worry I can't shake.",
 "I'm putting something off and feeling guilty about it."
];
SCREENS.chat = ()=>{
  const c = el(`<div class="chatwrap"></div>`);
  const hd = el(`<div class="chat-hd"><div><h1>Talk it through</h1><p class="muted" style="margin:2px 0 0">A CBT-style coach. Not a therapist, and not for emergencies.</p></div><button class="btn ghost sm" data-new>New chat</button></div>`);
  const msgs = el(`<div class="msgs" role="log" aria-live="polite"></div>`);
  const comp = el(`<div class="composer"><textarea rows="1" placeholder="What's on your mind?" aria-label="Message"></textarea><button class="btn" data-send>Send</button></div>`);
  c.appendChild(hd); c.appendChild(msgs); c.appendChild(comp);
  const ta = comp.querySelector("textarea"), sendBtn = comp.querySelector("[data-send]");
  let busy = false, lastErr = null;

  const draw = ()=>{
    msgs.innerHTML = "";
    if(!AI){
      const n = el(`<div class="notice">Chat needs a free Groq key. Add one in Settings — it takes two minutes.<div style="margin-top:10px"><button class="btn sm">Open Settings</button></div></div>`);
      n.querySelector("button").onclick = ()=> go("settings");
      msgs.appendChild(n);
    }
    if(!S.chat.length){
      msgs.appendChild(el(`<div class="msg bot"><p>Hi. Tell me what's on your mind — as raw as it sounds in your head. We'll look at it together: what you're telling yourself, whether it holds up, and what a truer version might sound like.</p></div>`));
      const st = el(`<div class="starters"></div>`);
      STARTERS.forEach(s=>{ const b = el(`<button class="chip">${esc(s)}</button>`); b.onclick = ()=> send(s); st.appendChild(b); });
      msgs.appendChild(st);
    }
    S.chat.forEach(m=>{
      if(m.role === "user"){
        msgs.appendChild(el(`<div class="msg me">${esc(m.content).replace(/\n/g,"<br>")}</div>`));
        if(m.flag) msgs.appendChild(crisisCard());
      } else {
        msgs.appendChild(el(`<div class="msg bot">${mdLite(m.content)}</div>`));
      }
    });
    if(busy) msgs.appendChild(el(`<div class="msg bot"><span class="thinking"><i></i><i></i><i></i></span></div>`));
    if(lastErr && !busy){
      const e = aiErrorCard(lastErr);
      const rt = el(`<button class="btn ghost sm" style="margin-top:10px">Try again</button>`);
      rt.onclick = ()=>{ lastErr = null; reply(); };
      e.appendChild(rt);
      msgs.appendChild(e);
    }
    msgs.scrollTop = msgs.scrollHeight;
    sendBtn.disabled = busy;
    ta.disabled = !AI;
    sendBtn.disabled = busy || !AI;
  };

  const reply = async ()=>{
    busy = true; lastErr = null; draw();
    const risk = S.chat.length && S.chat[S.chat.length-1].flag;
    try{
      const txt = await MODEL.chat(S.chat, !!risk);
      S.chat.push({role:"assistant", content:txt, ts:Date.now()});
      if(S.chat.length > 80) S.chat = S.chat.slice(-60);
      save();
    }catch(err){ lastErr = err; }
    busy = false; draw();
  };
  const send = text=>{
    text = String(text||"").trim();
    if(!text || busy || !AI) return;
    S.chat.push({role:"user", content:text, ts:Date.now(), flag: riskFlagged(text)});
    save();
    ta.value = ""; ta.style.height = "auto";
    reply();
  };
  sendBtn.onclick = ()=> send(ta.value);
  const coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
  ta.onkeydown = e=>{ if(e.key==="Enter" && !e.shiftKey && !coarse){ e.preventDefault(); send(ta.value); } };
  ta.oninput = ()=>{ ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; };
  hd.querySelector("[data-new]").onclick = ()=>{
    if(S.chat.length && !confirm("Start a new conversation? The current one will be cleared.")) return;
    S.chat = []; lastErr = null; save(); draw();
  };
  draw();
  return c;
};

/* ═══ SCREEN: More (mobile) ═════════════════════════════ */
SCREENS.more = ()=>{
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>More</h1>`));
  c.appendChild(el(`<p class="lede">Everything else in the toolkit.</p>`));
  const g = el(`<div class="tiles"></div>`);
  [["checkin","Check-in","Depression & anxiety scores"],["activate","Activate","Schedule and predict activities"],["expose","Exposure","Climb a fear ladder"],["rumination","Unstick","Break a thought loop"],["progress","Progress","Your patterns and shifts"],["settings","Settings","Themes, key, your data"]]
    .forEach(([id,t,s])=>{ const b = el(`<button class="tile"><b>${esc(t)}</b><span>${esc(s)}</span></button>`); b.onclick = ()=> go(id); g.appendChild(b); });
  c.appendChild(g);
  return c;
};

document.documentElement.dataset.theme = S.settings.theme || "daylight";
refreshAI();
go("home");
if(!S.intro) showIntro();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
