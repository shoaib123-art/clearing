<!DOCTYPE html>
<html lang="en" data-theme="daylight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clearing — cognitive therapy you do yourself</title>
<meta name="description" content="Free, private, self-guided cognitive behavioural therapy: thought records, behavioural activation, exposure ladders and rumination tools.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EFF4F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --bg:#EFF4F9; --surface:#FFFFFF; --surface-2:#F6FAFD; --line:#D9E4EE;
  --ink:#14232D; --ink-2:#496070; --ink-3:#7B8FA0;
  --accent:#2C7A8C; --accent-2:#1F5C6B; --accent-soft:#DCEDF1; --on-accent:#FFFFFF;
  --hot:#C4553F; --hot-soft:#F7E3DE; --calm:#4B8060; --calm-soft:#E0EFE6;
  --amber:#9A7324;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow:0 1px 2px rgba(20,35,45,.05), 0 8px 24px -14px rgba(20,35,45,.28);
  --maxw:720px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="meadow"]{
  --bg:#F1F6EF; --surface:#FFFFFF; --surface-2:#F7FBF5; --line:#DCE7D7;
  --ink:#1B2A1D; --ink-2:#4B5E4C; --ink-3:#7E8E7E;
  --accent:#4C7A48; --accent-2:#3A5F37; --accent-soft:#E2EFDE;
  --hot:#B0603C; --hot-soft:#F5E6DD; --calm:#3F7A63; --calm-soft:#DFEEE8; --amber:#8A7020;
}
:root[data-theme="blush"]{
  --bg:#FBF3F4; --surface:#FFFFFF; --surface-2:#FDF8F8; --line:#EEDCDE;
  --ink:#2B1F24; --ink-2:#5D4A50; --ink-3:#8E7A80;
  --accent:#A9546A; --accent-2:#843F53; --accent-soft:#F7E4E8;
  --hot:#B54B47; --hot-soft:#F8E3E2; --calm:#5A7C6A; --calm-soft:#E4EFE9; --amber:#96702C;
}
:root[data-theme="linen"]{
  --bg:#F7F3EC; --surface:#FFFDF8; --surface-2:#FAF6EF; --line:#E6DDCE;
  --ink:#282319; --ink-2:#585043; --ink-3:#8A8170;
  --accent:#7A6134; --accent-2:#5C4923; --accent-soft:#EFE5D2;
  --hot:#A85A38; --hot-soft:#F4E4D9; --calm:#5A7350; --calm-soft:#E6EDE0; --amber:#8A6A22;
}
:root[data-theme="dusk"]{
  --bg:#161A21; --surface:#1E232C; --surface-2:#232935; --line:#313947;
  --ink:#E7ECF3; --ink-2:#A9B6C5; --ink-3:#7D8B9B;
  --accent:#6FAEC0; --accent-2:#8CC6D6; --accent-soft:#25353D; --on-accent:#0E1418;
  --hot:#D98771; --hot-soft:#3A2A25; --calm:#7EB894; --calm-soft:#233129; --amber:#C6A05A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── shell ──────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line);background:var(--surface);
  padding:22px 14px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px 18px}
.brand b{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:25px;letter-spacing:-.015em}
.brand span{font-size:11.5px;color:var(--ink-3)}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 10px;border:0;border-radius:var(--radius-s);background:none;color:var(--ink-2);
  font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.navbtn .gl{width:18px;text-align:center;font-size:15px;opacity:.9}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
main{padding:34px 28px 90px;min-width:0}
.wrap{max-width:var(--maxw);margin:0 auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;
    border-right:0;border-top:1px solid var(--line);z-index:40;overflow-x:auto;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;
  }
  .brand,.rail-foot{display:none}
  .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;justify-content:center;min-width:62px}
  .navbtn .gl{font-size:17px}
  main{padding:20px 16px 110px}
}

/* ── type ───────────────────────────────────────────────── */
h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:22px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:.005em}
p{margin:0 0 12px;max-width:66ch}
.lede{color:var(--ink-2);font-size:16.5px;max-width:60ch;margin-bottom:26px}
.muted{color:var(--ink-3);font-size:13.5px}
.serifbody{font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.6}

/* ── pieces ─────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.step{display:flex;gap:14px;margin-bottom:22px}
.step-n{
  flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px
}
.step-b{flex:1;min-width:0}
label.fl{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
textarea,input[type=text],input[type=email],select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:15.5px;resize:vertical;
}
textarea{font-family:Newsreader,Georgia,serif;font-size:17.5px;line-height:1.55;min-height:96px}
textarea::placeholder,input::placeholder{color:var(--ink-3);font-family:Figtree,sans-serif;font-size:15px}
textarea:focus,input:focus,select:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border-radius:999px;border:1px solid transparent;
  background:var(--accent);color:var(--on-accent);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:background .15s ease;
}
.btn:hover{background:var(--accent-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:transparent;color:var(--ink-2);border-color:transparent;padding:8px 10px}
.btn.quiet:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-size:13px;font-weight:500;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2);font-weight:600}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-2)}
.tag.hot{background:var(--hot-soft);color:var(--hot)}
.tag.calm{background:var(--calm-soft);color:var(--calm)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* sliders */
.sl{display:grid;grid-template-columns:1fr 46px;gap:12px;align-items:center;margin-bottom:9px}
.sl .nm{font-size:14px;font-weight:500}
.sl .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;color:var(--accent-2)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:999px;
  background:linear-gradient(90deg,var(--accent) var(--pct,0%),var(--line) var(--pct,0%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--surface);
  border:2.5px solid var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)
}
input[type=range]::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;background:var(--surface);
  border:2.5px solid var(--accent);cursor:pointer
}
.sl-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:-4px;margin-bottom:12px}

/* results */
.reveal{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.dist{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:16px}
.dist h3{color:var(--accent-2)}
.dist .ev{font-family:Newsreader,Georgia,serif;font-style:italic;color:var(--ink-2);font-size:16px}
.quote{
  font-family:Newsreader,Georgia,serif;font-size:19px;line-height:1.5;color:var(--ink);
  border-left:3px solid var(--line);padding-left:16px;margin:0 0 14px;
}
.belief-bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0}
.belief-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px}
.stat b{display:block;font-family:Newsreader,serif;font-size:29px;font-weight:400;line-height:1.1;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-3)}
.list-item{border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;margin-bottom:10px;background:var(--surface)}
.empty{text-align:center;padding:42px 20px;color:var(--ink-3)}
.empty p{max-width:34ch;margin:0 auto 14px}
.thinking{display:inline-flex;gap:5px;align-items:center;color:var(--ink-3);font-size:13.5px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,60%,100%{opacity:.25}30%{opacity:1}}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-m);padding:14px 16px;font-size:14px;color:var(--ink-2);margin-bottom:16px}
.notice.care{border-color:var(--hot);background:var(--hot-soft);color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);cursor:pointer;position:relative;overflow:hidden}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw i{position:absolute;inset:0;display:block}
.sw i::after{content:"";position:absolute;right:7px;bottom:7px;width:15px;height:15px;border-radius:50%}
svg.chart{width:100%;height:auto;display:block}
.ladder-rung{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-m);margin-bottom:8px;background:var(--surface)}
.ladder-rung .suds{flex:0 0 46px;text-align:center;font-weight:700;font-size:15px;color:var(--hot);font-variant-numeric:tabular-nums}
.ladder-rung.done{background:var(--calm-soft);border-color:var(--calm)}
.ladder-rung.done .suds{color:var(--calm)}
.auth{max-width:400px;margin:8vh auto;text-align:left}
.dot-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.dot-key b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
details.method{border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:8px;background:var(--surface)}
details.method summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
details.method summary::-webkit-details-marker{display:none}
details.method summary::before{content:"+";color:var(--accent);font-weight:700;margin-right:8px}
details.method[open] summary::before{content:"–"}
details.method p{margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:99;background:var(--surface);padding:8px 14px;border-radius:8px}

/* ══ v2 additions ═══════════════════════════════════════════ */
.navsep{margin:12px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.morebtn{display:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2);margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tabs .chip{white-space:nowrap;padding:8px 14px;font-size:13.5px}

/* intro overlay */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(14,26,34,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);width:100%;max-width:580px;
  padding:28px 26px;box-shadow:0 30px 80px -30px rgba(0,0,0,.55);max-height:100%;overflow-y:auto}
@media(max-width:520px){.sheet{padding:22px 18px}}

/* triangle */
.tri-grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:640px){.tri-grid{grid-template-columns:1fr}.tri-svg{max-width:300px;margin:0 auto}}
.tri-event{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;font-size:14.5px;margin-top:6px}
.tri-row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.tri-row:last-child{border-bottom:0}
.tri-row b{color:var(--tri,var(--accent-2));font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.tri-tag{margin:14px 0 0;color:var(--ink-2);font-size:17px;max-width:none}

/* four moves */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.flow{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.flow{grid-template-columns:1fr}}
.flow-step{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px}
.flow-step p{font-size:13.5px;color:var(--ink-2);margin:0}
.flow-n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:700;margin-bottom:8px}

/* principles */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.pgrid{grid-template-columns:1fr}}
.pr{display:flex;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:13px}
.pr .n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:13px;font-weight:700}
.pr h3{margin:0 0 3px;font-size:14.5px}
.pr p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* ten distortions */
.tengrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:640px){.tengrid{grid-template-columns:1fr}}
.tencard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;box-shadow:var(--shadow)}
.tencard .bar{height:5px;background:var(--c,var(--accent))}
.tencard .in{padding:14px 15px 16px}
.tenhead{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.tenico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:0 0 44px;color:var(--c,var(--accent-2));background:var(--accent-soft);background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface))}
.tenico svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tennum{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.07em}
.tencard h3{margin:0;font-size:15.5px;line-height:1.25}
.tensay{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:16px;line-height:1.45;color:var(--ink-2);margin:0 0 10px;border-left:3px solid var(--line);padding-left:11px;max-width:none}
.tenfix{font-size:13.5px;color:var(--ink);margin:0;max-width:none}
.tenfix b{color:var(--c,var(--accent-2))}

/* choice buttons (quiz, check-in) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.opts,.opts.four{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.opts,.opts.four{grid-template-columns:1fr}}
.opt{padding:11px 12px;text-align:left;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;line-height:1.35;cursor:pointer}
.opt:hover{background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.opt.right{border-color:var(--calm);background:var(--calm-soft);color:var(--ink)}
.opt.wrong{border-color:var(--hot);background:var(--hot-soft);color:var(--ink)}
.opt[disabled]{cursor:default}

/* topics */
.topic{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-bottom:10px}
.topic .n{flex:0 0 30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px}
.topic h3{margin:0 0 3px;font-size:15px}
.topic p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}

/* breathing */
.breath{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 14px}
.orbwrap{height:200px;width:100%;display:grid;place-items:center}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent));transform:scale(.55);transition:transform 4s ease-in-out;opacity:.95;box-shadow:0 0 0 10px var(--accent-soft)}
.blabel{font-weight:600;font-size:18px;color:var(--ink);min-height:28px}

/* tiles on Today */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}

<script>
/* ═══════════════════════════════════════════════════════════
   Clearing — self-guided cognitive therapy
   Data model, storage, router, screens, and AI assistance.
   ═══════════════════════════════════════════════════════════ */

/* ── clinical content ───────────────────────────────────── */
const DISTORTIONS = [
  {id:"allnone", name:"All-or-nothing thinking",
   def:"You judge yourself or a situation in absolute categories — total success or total failure, with no middle ground. Real life almost always lands somewhere in between.",
   ask:"What would a partial version of this look like? Where does it actually fall between 0 and 100?"},
  {id:"overgen", name:"Overgeneralisation",
   def:"You treat one event as a permanent pattern. Words like always, never, and every time are the fingerprint.",
   ask:"How many times has this actually happened, and how many times has it not?"},
  {id:"filter", name:"Mental filter",
   def:"You pick out a single negative detail and dwell on it until the whole picture darkens, the way one drop of ink colours a glass of water.",
   ask:"What else was in the frame that you skipped past?"},
  {id:"discount", name:"Discounting the positive",
   def:"Good things get disqualified — it was luck, it was easy, anyone could have done it — so nothing you do is ever allowed to count.",
   ask:"If a colleague had done exactly this, what would you say it showed about them?"},
  {id:"mindread", name:"Mind reading",
   def:"You assume you know what someone thinks of you, and you assume it's bad, without having checked.",
   ask:"What's the evidence for what they think? What else could explain how they acted?"},
  {id:"fortune", name:"Fortune telling",
   def:"You predict a bad outcome as though it were already settled fact, then feel the disappointment now.",
   ask:"What odds would you actually put on this? What has happened the last few times you predicted this?"},
  {id:"magnify", name:"Magnification and minimisation",
   def:"Your errors get inspected through a telescope and your strengths through the wrong end of it.",
   ask:"How large will this look in six months? Are you scaling both sides the same way?"},
  {id:"emotion", name:"Emotional reasoning",
   def:"You take the feeling as the evidence: I feel like a fraud, therefore I am one. Feelings report your thoughts, not the facts.",
   ask:"What would you conclude if you only had the facts and not the feeling?"},
  {id:"should", name:"Should statements",
   def:"You run your life on shoulds, musts, and oughts aimed at yourself, other people, or the world. Aimed inward they make guilt; aimed outward, anger.",
   ask:"Replace the should with a preference — I'd rather. Does anything true get lost?"},
  {id:"label", name:"Labelling",
   def:"Instead of describing what happened, you name what you are: not I made a mistake, but I'm an idiot. A label cannot be corrected, only worn.",
   ask:"What specifically happened? Can you describe the behaviour without naming the person?"},
  {id:"blame", name:"Personalisation and blame",
   def:"You hold yourself responsible for something you didn't fully control, or you hold someone else entirely responsible and skip your own part.",
   ask:"List everything that contributed. What slice is genuinely yours?"}
];

const CORE_BELIEFS = [
  {id:"unlovable", name:"I'm unlovable", def:"If people really knew me, they'd leave. Closeness feels conditional on performance."},
  {id:"inadequate", name:"I'm not good enough", def:"Worth has to be earned by output. Any shortfall is proof of the deficit you already suspected."},
  {id:"helpless", name:"I can't cope", def:"Difficulty is read as evidence you lack the capacity, so avoidance starts to look like sense."},
  {id:"worthless", name:"I don't matter", def:"Your needs come last by default, and asking feels like an imposition."},
  {id:"perfection", name:"I must not fail", def:"Anything less than flawless registers as failure, so standards do the work of a threat."},
  {id:"approval", name:"I need everyone's approval", def:"One person's disapproval outweighs a room's goodwill."},
  {id:"abandon", name:"People will leave", def:"You scan for the exit signs, and the scanning itself strains the relationship."},
  {id:"control", name:"I must stay in control", def:"Uncertainty registers as danger, so you over-prepare and still don't feel ready."}
];

const METHODS = [
  {id:"evidence", name:"Examine the evidence", how:"Stop arguing with the thought and audit it. Two columns: facts that support it, facts that contradict it. Only admissible facts — things a camera would have caught, not impressions."},
  {id:"double", name:"The double standard", how:"Say the thought out loud to a friend you respect who is in exactly your situation. If you wouldn't say it to them, you've found a standard you apply to no one but yourself."},
  {id:"experiment", name:"Run the experiment", how:"Turn the thought into a prediction with a number, then go test it. 'Nobody will reply' becomes 'fewer than 1 in 5 will reply'. Reality gets a vote."},
  {id:"survey", name:"Take a survey", how:"Ask three people whether they'd think less of you for this. You are guessing at a fact you can simply look up."},
  {id:"grey", name:"Think in shades of grey", how:"Refuse the 0-or-100 frame. Score the outcome out of 100 and defend the number. Most disasters turn out to be a 38."},
  {id:"define", name:"Define the term", how:"You called yourself a failure — define failure precisely enough that another person could score you on it. The definition usually collapses under its own weight."},
  {id:"costben", name:"Cost-benefit analysis", how:"What does holding this belief get you, and what does it cost you? Belief isn't only about truth; sometimes you keep one because it feels like protection."},
  {id:"reattrib", name:"Reattribution", how:"Name every contributing cause, including circumstances and other people, then take only your genuine share. Responsibility is a pie chart, not a switch."},
  {id:"accept", name:"The acceptance paradox", how:"Instead of defending against the criticism, concede the human part of it without the verdict: yes, I handled that badly, and I'm still not a bad person. Defence feeds the attack; acceptance starves it."},
  {id:"paradox", name:"Ask what it protects", how:"Before you dismantle a thought, ask what it's trying to do for you. Self-criticism often masquerades as motivation. Thank it, then check whether it actually works."}
];

const EMOTIONS = [
  {id:"sad", name:"Sad, down, blue"},
  {id:"anx", name:"Anxious, worried, panicky"},
  {id:"guilt", name:"Guilty, remorseful"},
  {id:"inferior", name:"Inferior, inadequate"},
  {id:"lonely", name:"Lonely, unwanted"},
  {id:"ashamed", name:"Embarrassed, ashamed"},
  {id:"hopeless", name:"Hopeless, stuck"},
  {id:"angry", name:"Angry, resentful, irritated"}
];

const UNSTICK = [
  {id:"name", title:"Name it as an activity", secs:60,
   body:"Say to yourself: I am ruminating. Not — I am solving this. Rumination feels like problem-solving but never produces a next action. Check: in the last ten minutes, did this thinking produce one thing you could do? If not, it isn't analysis."},
  {id:"window", title:"Postpone it to the worry window", secs:90,
   body:"Write the worry down and set it aside for a fixed 15 minutes later today. You're not suppressing it — you're giving it an appointment. Most worries lose their urgency by the time the window opens, and the ones that don't get your full attention."},
  {id:"senses", title:"Come back through your senses", secs:120,

const CRISIS_TERMS = ["kill myself","kill my self","suicide","suicidal","end my life","end it all","want to die","better off dead","hurt myself","harm myself","self harm","self-harm","cut myself","no reason to live","take my own life"];

  settings:{theme:"daylight", serif:true, ai:true, key:""},

/* ── AI ─────────────────────────────────────────────────── */
/* Model access.
   Two modes, and the app picks whichever is configured:
   A) PROXY  — set PROXY_URL to your own Cloudflare Worker. Users need no key.
   B) OWN KEY — each user pastes a free Groq key in Settings. No server needed.
   Leaving PROXY_URL empty falls back to mode B. */
const PROXY_URL = "";                       // e.g. "https://clearing-api.yourname.workers.dev"
const GROQ_URL   = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"]; // tries the first, falls back on error

function parseLoose(txt){
  try{ return JSON.parse(txt); }catch(e){}
  const fence = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence){ try{ return JSON.parse(fence[1]); }catch(e){} }
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  const c = txt.indexOf("["), d = txt.lastIndexOf("]");
  const cands = [];
  if(a>-1 && b>a) cands.push(txt.slice(a,b+1));
  if(c>-1 && d>c) cands.push(txt.slice(c,d+1));
  cands.sort((x,y)=>x.length-y.length);
  for(const k of cands){ try{ return JSON.parse(k); }catch(e){} }
  const err = new Error("no json"); err.code = "invalid_json"; throw err;
}

const SYS_JSON = "You are a careful assistant inside a cognitive behavioural therapy self-help tool. You never diagnose. You reply with a single valid JSON object only — no prose, no markdown code fences, no text before or after the JSON.";

const CHAT_SYSTEM = `You are "Clearing", a warm, plain-spoken CBT coach inside a self-help app. You help the user examine and reframe distressing thoughts using established cognitive behavioural techniques, in the style popularised by Dr. David Burns (Feeling Good, T.E.A.M.-CBT): empathy first, then testing the thought.

How to respond:
- Begin by reflecting the feeling and what hurts, briefly and genuinely, before any technique. Never rush to reassure.
- Name the likely thinking errors in the user's own words, using this list: all-or-nothing thinking, overgeneralisation, mental filter, discounting the positive, mind reading, fortune telling, magnification/minimisation, emotional reasoning, should statements, labelling, personalisation/blame. Explain each in one plain sentence. Say "this sounds like", never "you have".
- Ask ONE good Socratic question at a time, one the user can answer from facts they already know. Never stack questions.
- Once the user has engaged, offer two or three alternative, balanced thoughts. Each must be TRUE (defensible with evidence) and must acknowledge what actually hurt. Never toxic positivity, never "just think positive".
- Where it fits, suggest one concrete method (examine the evidence, double standard, shades of grey, experiment, cost-benefit, reattribution) and one small action (an activity to schedule or an exposure step).
- Invite the user to rate their belief in the thought from 0 to 100 before and after.
- Keep replies under about 170 words unless asked for more. Plain language. Light formatting only: short paragraphs, occasional bold, short lists.
- You are not a therapist. You cannot diagnose, or give medical or medication advice; if asked, say so kindly and suggest a doctor or counsellor.
- SAFETY: if the user mentions suicide, self-harm, abuse, or being in danger, stop the CBT work. Respond with warmth, say you're concerned, encourage them to contact someone right now (a trusted person, their local emergency number, or a helpline — findahelpline.com lists one for any country; in Pakistan, Umang 0311-7786264), and ask if they are safe. Do not argue with them and never give methods.
- Stay on topic: thoughts, feelings, behaviour, mood, worry, relationships, coping. Politely decline unrelated tasks.
- Reply in the same language the user writes in.`;

async function groqRequest(model, messages, o, headers){
  const base = {model, temperature: (o.temperature != null ? o.temperature : 0.4), max_tokens: o.maxTokens || 1600, messages};
  const full = Object.assign({}, base);
  if(o.json) full.response_format = {type:"json_object"};
  if(String(model).indexOf("gpt-oss") > -1) full.reasoning_effort = "low";
  const post = body => fetch(PROXY_URL || GROQ_URL, {method:"POST", headers, body:JSON.stringify(body)});
  let res = await post(full);
  // Some models reject optional fields; retry once with the plain request.
  if(res.status === 400 && (full.response_format || full.reasoning_effort)) res = await post(base);
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j && j.error && j.error.message) || JSON.stringify(j).slice(0,300); }
    catch(e){ try{ detail = (await res.text()).slice(0,300); }catch(e2){} }
    const e = new Error("http " + res.status);
    e.status = res.status; e.detail = detail;
    e.code = res.status===401 ? "not_granted"
           : res.status===429 ? "rate_limited"
           : res.status>=500  ? "upstream_error" : "refused";
    throw e;
  }
  const data = await res.json();
  const msg = data && data.choices && data.choices[0] && data.choices[0].message;
  return String((msg && msg.content) || "").replace(/<think>[\s\S]*?<\/think>/g, "").trim();
}

async function runModels(messages, o){
  const key = (S.settings.key || "").trim();
  if(!PROXY_URL && !key){ const e = new Error("No key saved yet."); e.code = "not_granted"; throw e; }
  const headers = {"Content-Type":"application/json"};
  if(!PROXY_URL) headers["Authorization"] = "Bearer " + key;
  let lastErr = null;
  for(const m of GROQ_MODELS){
    try{
      const txt = await groqRequest(m, messages, o, headers);
      if(!txt){ const e = new Error("The model returned an empty reply."); e.code = "invalid_json"; e.detail = "Empty reply from " + m; throw e; }
      return o.json ? parseLoose(txt) : txt;
    }catch(err){
      if(!err.code){ err.code = "upstream_error"; err.detail = err.detail || err.message || "Network error"; }
      if(err.code === "not_granted" || err.code === "rate_limited") throw err; // another model won't help
      lastErr = err;
    }
  }
  throw lastErr || Object.assign(new Error("offline"), {code:"upstream_error"});
}

const MODEL = {
  json(prompt){
    return runModels([{role:"system", content:SYS_JSON}, {role:"user", content:prompt}], {json:true, maxTokens:2200});
  },
  chat(history, risk){
    const msgs = history.slice(-20).map(m=>({role:m.role, content:m.content}));
    const sys = CHAT_SYSTEM + (risk ? "\n\nIMPORTANT: the user's latest message may indicate a risk of self-harm. Follow the SAFETY rule now: set CBT work aside, respond with warmth, express concern, encourage reaching out to someone right now, and ask whether they are safe." : "");
    return runModels([{role:"system", content:sys}].concat(msgs), {temperature:0.6, maxTokens:1600});
  },
  /* Quick connectivity check for the Settings "Test connection" button. */
  async test(){
    try{
      await runModels([{role:"system", content:SYS_JSON}, {role:"user", content:'Reply with only this JSON object: {"ok":true}'}], {json:true, maxTokens:600});
      return {ok:true};
    }catch(err){
      return {ok:false, detail:(err.detail || err.message || "Unknown error") + (err.status ? " (HTTP " + err.status + ")" : "")};
    }
  }
};

let AI = null;
function refreshAI(){ AI = (PROXY_URL || (S.settings.key||"").trim().length > 10) ? MODEL : null; }

const AI_ERRORS = {
  not_granted:"Automatic analysis isn\u2019t switched on. Add a free Groq key in Settings, or label the thought yourself below.",
  sampling_disabled:"Automatic analysis isn\u2019t available. The manual tools below do the same work.",
  rate_limited:"The free model is busy or you\u2019ve hit today\u2019s limit. Wait a minute, or label the thought yourself below.",
  refused:"That one couldn't be analysed automatically. Use the manual labelling below.",
  invalid_json:"The analysis came back garbled. Try again, or label it yourself below.",
  cancelled:"",
  upstream_error:"Couldn\u2019t reach the model \u2014 check your connection. The manual tools below work the same way.",
  default:"Analysis didn\u2019t come through. The manual tools below work the same way."
};
function aiMsg(code){ return AI_ERRORS[code] ?? AI_ERRORS.default; }
function aiErrorCard(err){

  return el(`<div class="notice">${esc(base)}${detail}</div>`);
}

function riskFlagged(text){
  const t = " " + String(text||"").toLowerCase().replace(/[^a-z\s-]/g," ") + " ";
  return CRISIS_TERMS.some(k => t.includes(k));
}

/* ═══ SCREEN: Today ═════════════════════════════════════ */
SCREENS.home = ()=>{
  const c = el(`<div></div>`);
  const name = S.account?.name || S.account?.email?.split("@")[0] || "";
  const hour = new Date().getHours();
  const greet = hour<12 ? "Good morning" : hour<18 ? "Good afternoon" : "Good evening";
  c.appendChild(el(`<h1>${greet}${name?", "+esc(name):""}.</h1>`));
  c.appendChild(el(`<p class="lede">What's weighing on you? Start where the feeling is loudest — the rest of the method will follow from there.</p>`));

  const last = S.records[0];
  const shifts = S.records.filter(r=>r.after!=null);
  const avgShift = shifts.length ? Math.round(shifts.reduce((a,r)=>a+(r.before-r.after),0)/shifts.length) : null;

  c.appendChild(el(`<div class="grid2" style="margin-bottom:22px">
    <div class="stat"><b>${S.records.length}</b><span>thoughts worked through</span></div>
    <div class="stat"><b>${avgShift!=null? avgShift+"%" : "—"}</b><span>average drop in belief</span></div>
  </div>`));

  const start = el(`<div class="card">
    <div class="card-hd"><div>
      <h2>Work on a thought</h2>
      <p class="muted" style="margin:0">Twelve minutes, start to finish. Write it down, find the distortion, build something truer.</p>
    </div></div>
    <div class="row">
      <button class="btn" data-a="record">Start a thought record</button>
      <button class="btn ghost" data-a="rumination">I'm stuck in a loop</button>
    </div>
  </div>`);
  start.querySelectorAll("[data-a]").forEach(b=> b.onclick=()=> go(b.dataset.a));
  c.appendChild(start);

  const tiles = el(`<div class="tiles">
    <button class="tile" data-a="chat"><b>Talk it through</b><span>Chat with a CBT coach</span></button>
    <button class="tile" data-a="journal"><b>Mood log</b><span>The full written sheet</span></button>
    <button class="tile" data-a="checkin"><b>Check-in</b><span>Depression &amp; anxiety scores</span></button>
    <button class="tile" data-a="learn"><b>Learn</b><span>Triangle, 10 distortions, more</span></button>
  </div>`);
  tiles.querySelectorAll("[data-a]").forEach(b=> b.onclick = ()=> go(b.dataset.a));
  c.appendChild(tiles);

  const due = S.activities.filter(a=>!a.done);
  if(due.length){
    const box = el(`<div class="card"><h2>Scheduled today</h2></div>`);
    due.slice(0,3).forEach(a=>{
      const row = el(`<div class="ladder-rung">
        <div style="flex:1"><b style="font-weight:600">${esc(a.title)}</b>
        <div class="muted">predicted — pleasure ${a.predP}, mastery ${a.predM}</div></div>
        <button class="btn sm ghost">Mark done</button></div>`);
      row.querySelector("button").onclick = ()=> go("activate", a.id);
      box.appendChild(row);
    });
    c.appendChild(box);
  }

  if(last){
    const l = el(`<div class="card flat">
      <h2>Where you left off</h2>
      <blockquote class="quote">${esc(last.thought)}</blockquote>
      <div class="row"><span class="tag">${esc(last.distortions?.[0]?.name || "unlabelled")}</span>
      <span class="muted">${fmt(last.ts)}</span></div>
    </div>`);
    l.onclick = ()=> go("progress");
    l.style.cursor = "pointer";
    c.appendChild(l);
  } else {
    c.appendChild(el(`<div class="card flat"><h2>How this works</h2>
      <p>Feelings don't come from events. They come from the sentence you tell yourself about the event — and that sentence is usually distorted in one of about eleven predictable ways. Find the distortion, write a version that's both truer and kinder, and the feeling shifts. Not by pretending. By being more accurate.</p>
      <p class="muted" style="margin:0">Then you go and do something, because insight alone doesn't lift mood — action does. That's what Activate and Exposure are for.</p></div>`));
  }
  return c;
};

/* ═══ SCREEN: Thought record ════════════════════════════ */
SCREENS.record = ()=>{
  const draft = {thought:"", before:80, after:null, distortions:[], core:null, reframe:""};
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>Reframe a thought</h1>`));
  c.appendChild(el(`<p class="lede">Write it exactly as it sounds in your head. One label, three ways to answer it back — pick the one that actually lands.</p>`));

  const input = el(`<div class="card">
    <textarea id="thought" rows="3" placeholder="I'm invisible here. Nobody takes me seriously and they never will."></textarea>
    <div style="margin:14px 0 4px">
      <label class="fl">How much do you believe it, right now?</label>
      <div id="beliefslider"></div>
      <div class="sl-lab"><span>not at all</span><span>completely</span></div>
    </div>
    <button class="btn" id="go">Reframe it</button>
  </div>`);
  input.querySelector("#beliefslider").appendChild(slider("Belief in the thought", 80, v => draft.before = v));
  c.appendChild(input);

  const out = el(`<div id="out"></div>`);
  c.appendChild(out);

  input.querySelector("#go").onclick = async ()=>{
    draft.thought = c.querySelector("#thought").value.trim();
    if(!draft.thought){ c.querySelector("#thought").focus(); return; }

    out.innerHTML = "";
    if(riskFlagged(draft.thought)) out.appendChild(crisisCard());

    const btn = input.querySelector("#go");
    btn.disabled = true;
    const think = thinkingEl("Reading it closely…");
    out.appendChild(think);

    let result = null, error = null;
    if(AI){
      const prompt =
`You are assisting inside a self-guided cognitive behavioural therapy tool. You are not a clinician and must not diagnose.

The user's automatic thought, verbatim: ${draft.thought}
Belief in the thought: ${draft.before}/100

Distortion categories (use these exact ids):
${DISTORTIONS.map(d=>`${d.id} = ${d.name}: ${d.def}`).join("\n")}

Core belief categories (use these exact ids):
${CORE_BELIEFS.map(b=>`${b.id} = ${b.name}: ${b.def}`).join("\n")}

Reply with ONLY a JSON object, no prose around it:
{
 "risk": "none" | "concern",
 "distortions": [{"id":"<id>","quote":"<exact words from their thought that show it>","why":"<one sentence, second person, plain and warm, no jargon>"}],
 "core": {"id":"<id>","why":"<one sentence on what the thought implies they believe about themselves>"},
 "reframes": [
   {"text":"<a truer version of the thought, first person, keeping their facts>","note":"<one sentence on which method this uses and why it's more accurate, e.g. examines the evidence, or finds the shade of grey>"},
   {"text":"<a second, differently-angled truer version>","note":"<one sentence, different method than the first>"},
   {"text":"<a third truer version, the most concise of the three>","note":"<one sentence, different method again>"}
 ]
}

Rules: one to three distortions, ordered by how strongly present, using only words that really appear in the thought. The three reframes must be genuinely different from each other in angle, not restatements. Each must be TRUE (defensible with evidence, not wishful) and must LAND (acknowledge what actually hurt rather than skip past it) — a merely cheerful line fails both tests. Set risk to "concern" only if the text suggests self-harm, suicide, or danger to someone.`;
      try{ result = await AI.json(prompt); }
      catch(err){ error = err; }
    }
    think.remove();
    btn.disabled = false;

    if(result?.risk === "concern") out.insertBefore(crisisCard(), out.firstChild);

    if(error) out.appendChild(aiErrorCard(error));
    if(!AI) out.appendChild(el(`<div class="notice">Automatic analysis isn't switched on. Add a free Groq key in Settings, or label the thought yourself below.</div>`));

    out.appendChild(buildAnalysis(draft, result));
    out.querySelector("[data-anchor]")?.scrollIntoView({behavior:"smooth",block:"start"});
  };
  return c;
};

function buildAnalysis(draft, r){
  const box = el(`<div data-anchor class="grid2" style="align-items:start"></div>`);
  const picked = new Set((r?.distortions||[]).map(d=>d.id).filter(id=>DISTORTIONS.some(x=>x.id===id)));

  /* ── left column: what's happening in the thought ───────── */
  const left = el(`<div class="card reveal">
    <h3>What's happening in this thought</h3>
    <div id="dlist" style="margin-top:10px"></div>
    <hr class="sep">
    <label class="fl">All categories — tap to add or remove</label>
    <div class="row" id="dchips"></div>
    <div id="corebox"></div>
  </div>`);
  const dlist = left.querySelector("#dlist");
  (r?.distortions||[]).forEach(d=>{
    const meta = DISTORTIONS.find(x=>x.id===d.id); if(!meta) return;
    dlist.appendChild(el(`<div class="dist">
      <h3>${esc(meta.name)}</h3>
      ${d.quote? `<p class="ev" style="margin-bottom:6px">“${esc(d.quote)}”</p>`:""}
      <p style="margin:0;font-size:14.5px;color:var(--ink-2)">${esc(d.why||meta.def)}</p>
    </div>`));
  });
  if(!dlist.children.length){
    dlist.appendChild(el(`<p class="muted" style="margin:0 0 4px">Pick the categories that fit. Most thoughts contain two or three.</p>`));
  }
  const chipwrap = left.querySelector("#dchips");
  DISTORTIONS.forEach(d=>{
    const ch = el(`<button class="chip" aria-pressed="${picked.has(d.id)}" title="${esc(d.def)}">${esc(d.name)}</button>`);
    ch.onclick = ()=>{
      const on = ch.getAttribute("aria-pressed")==="true";
      ch.setAttribute("aria-pressed", String(!on));
      on ? picked.delete(d.id) : picked.add(d.id);
    };
    chipwrap.appendChild(ch);
  });
  if(r?.core){
    const cb = CORE_BELIEFS.find(b=>b.id===r.core.id);
    if(cb) left.querySelector("#corebox").appendChild(el(`
      <hr class="sep">
      <label class="fl">The belief underneath</label>
      <div class="dist"><h3>${esc(cb.name)}</h3>
        <p style="margin:0;font-size:14.5px;color:var(--ink-2)">${esc(r.core.why||cb.def)}</p></div>`));
  }
  box.appendChild(left);

  /* ── right column: reframed versions ─────────────────────── */
  const right = el(`<div class="card reveal">
    <h3>Reframed</h3>
    <p class="muted" style="margin:4px 0 12px">Pick the one that's both true and actually changes something when you read it — or write your own.</p>
    <div id="rlist"></div>
  </div>`);
  const rlist = right.querySelector("#rlist");
  let chosen = "";
  const reframes = (r?.reframes||[]).filter(x=>x?.text);
  const renderReframe = (text, note, i)=>{
    const card = el(`<div class="list-item" style="cursor:pointer;margin-bottom:10px">
      <p class="serifbody" style="margin:0 0 6px">${esc(text)}</p>
      ${note? `<p class="muted" style="margin:0">${esc(note)}</p>`:""}
    </div>`);
    card.onclick = ()=>{
      rlist.querySelectorAll(".list-item").forEach(x=>{ x.style.borderColor="var(--line)"; x.style.background="var(--surface)"; });
      card.style.borderColor = "var(--accent)"; card.style.background = "var(--accent-soft)";
      chosen = text;
      own.value = text;
    };
    return card;
  };
  reframes.forEach((rf,i)=> rlist.appendChild(renderReframe(rf.text, rf.note, i)));
  if(!reframes.length){
    rlist.appendChild(el(`<p class="muted" style="margin:0 0 10px">Write your own truer version below. It has to be true — you'd defend it with evidence — and it has to land, meaning reading it actually changes something.</p>`));
  }
  const ownWrap = el(`<div style="margin-top:${reframes.length?"14px":"0"}">
    <label class="fl">${reframes.length?"Or write your own":"Your version"}</label>
    <textarea id="own" rows="3" placeholder="Write a version you'd actually defend with evidence."></textarea>
  </div>`);
  right.appendChild(ownWrap);
  const own = ownWrap.querySelector("#own");
  own.oninput = ()=>{ chosen = own.value.trim();
    rlist.querySelectorAll(".list-item").forEach(x=>{ x.style.borderColor="var(--line)"; x.style.background="var(--surface)"; }); };

  right.appendChild(el(`<hr class="sep">`));
  right.appendChild(el(`<label class="fl">Now, how much do you believe the original thought?</label>`));
  const afterWrap = el(`<div></div>`);
  let after = draft.before;
  afterWrap.appendChild(slider("Belief now", draft.before, v => after = v));
  right.appendChild(afterWrap);
  right.appendChild(el(`<div class="sl-lab"><span>not at all</span><span>completely</span></div>`));
  const finish = el(`<button class="btn" style="margin-top:4px">Save this record</button>`);
  finish.onclick = ()=>{
    draft.reframe = (chosen || own.value).trim();
    draft.after = after;
    draft.distortions = [...picked].map(id=>({id, name:DISTORTIONS.find(d=>d.id===id)?.name||id}));
    draft.core = r?.core?.id || null;
    draft.ts = Date.now(); draft.id = uid(); draft.date = today();
    S.records.unshift(draft);
    S.moods.push({date:today(), ts:Date.now(), emotions:{}, belief:{before:draft.before, after}});
    save();
    go("aftermath", draft.id);
  };
  right.appendChild(finish);
  box.appendChild(right);

  return box;
}

/* ═══ SCREEN: after a record ════════════════════════════ */
SCREENS.aftermath = (id)=>{
  const r = S.records.find(x=>x.id===id) || S.records[0];
  const c = el(`<div></div>`);
  const drop = r ? r.before - r.after : 0;
  c.appendChild(el(`<h1>${drop>=20?"That moved.":drop>0?"It shifted a little.":"It held its ground."}</h1>`));
  c.appendChild(el(`<p class="lede">${
    drop>=20 ? "Belief in the thought fell by "+drop+" points. That drop is the mechanism — you didn't argue yourself out of it, you found where it wasn't accurate."
    : drop>0 ? "A small move still counts. Thoughts tied to a long-standing belief rarely drop in one sitting; they drop across several."
    : "When belief doesn't move, the reframe usually isn't false — it just isn't the thing you actually believe yet. Try the cost-benefit method, or ask what the thought is protecting you from."}</p>`));

  if(r) c.appendChild(el(`<div class="card">
    <label class="fl">Original</label>
    <blockquote class="quote">${esc(r.thought)}</blockquote>
    <div class="belief-bar"><i style="width:${r.before}%"></i></div>
    <div class="spread"><span class="muted">believed ${r.before}%</span><span class="muted">now ${r.after}%</span></div>
    ${r.reframe? `<hr class="sep"><label class="fl">What you replaced it with</label>
      <p class="serifbody" style="margin:0">${esc(r.reframe)}</p>`:""}
  </div>`));

  const next = el(`<div class="card">
    <h2>Insight isn't the treatment</h2>
    <p>Understanding a thought lowers its grip. Acting against it is what stops it coming back. Pick the one that matches what the thought was doing to you.</p>
    <div class="row">
      <button class="btn" data-a="activate">It stopped me doing things</button>
      <button class="btn ghost" data-a="expose">It's making me avoid something</button>
      <button class="btn ghost" data-a="rumination">It won't stop looping</button>
    </div>
  </div>`);
  next.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>go(b.dataset.a));
  c.appendChild(next);
  const back = el(`<button class="btn quiet">‹ Back to today</button>`);
  back.onclick = ()=>go("home");
  c.appendChild(back);
  return c;
};

/* ═══ SCREEN: Behavioural activation ════════════════════ */
SCREENS.activate = (focusId)=>{
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>Behavioural activation</h1>`));
  c.appendChild(el(`<p class="lede">Low mood tells you to wait until you feel like it. You won't. Motivation follows action rather than preceding it, so you schedule the action first and let the feeling catch up.</p>`));

  const add = el(`<div class="card">
    <h2>Schedule something</h2>
    <p class="muted" style="margin-bottom:14px">Small and specific beats ambitious and vague. "Walk to the end of the road" — not "exercise more".</p>
    <textarea id="t" rows="1" placeholder="Call my brother for ten minutes"></textarea>
    <div style="margin-top:14px">
      <label class="fl">Predict it — before you do it</label>
      <div id="pp"></div><div id="pm"></div>
      <p class="muted" style="margin:4px 0 14px">Pleasure is how much you'll enjoy it. Mastery is how much it'll feel like an achievement. The prediction matters: depression systematically underestimates both, and seeing the gap in your own handwriting is more convincing than being told.</p>
    </div>
    <button class="btn" id="save">Add to the plan</button>
  </div>`);
  let pp=30, pm=30;
  add.querySelector("#pp").appendChild(slider("Predicted pleasure", 30, v=>pp=v));
  add.querySelector("#pm").appendChild(slider("Predicted mastery", 30, v=>pm=v));
  add.querySelector("#save").onclick = ()=>{
    const title = add.querySelector("#t").value.trim();
    if(!title) return add.querySelector("#t").focus();
    S.activities.unshift({id:uid(), title, predP:pp, predM:pm, done:false, ts:Date.now()});
    save(); go("activate");
  };
  c.appendChild(add);

  const planned = S.activities.filter(a=>!a.done);
  const done = S.activities.filter(a=>a.done);

  if(planned.length){
    const box = el(`<div class="card"><h2>Planned</h2></div>`);
    planned.forEach(a=>{
      const row = el(`<div class="list-item">
        <div class="spread" style="margin-bottom:8px">
          <b style="font-weight:600">${esc(a.title)}</b>
          <button class="btn sm ghost">I did it</button>
        </div>
        <span class="muted">predicted — pleasure ${a.predP}, mastery ${a.predM}</span>
        <div class="rate" hidden style="margin-top:14px"></div>
      </div>`);
      const rate = row.querySelector(".rate");
      row.querySelector("button").onclick = ()=>{
        if(!rate.hidden) return;
        rate.hidden = false;
        let ap=a.predP, am=a.predM;
        rate.appendChild(el(`<label class="fl">Now rate what it was actually like</label>`));
        rate.appendChild(slider("Actual pleasure", a.predP, v=>ap=v));
        rate.appendChild(slider("Actual mastery", a.predM, v=>am=v));
        const b = el(`<button class="btn sm">Save</button>`);
        b.onclick = ()=>{
          Object.assign(a, {done:true, actP:ap, actM:am, doneTs:Date.now()});
          save(); go("activate");
        };
        rate.appendChild(b);
      };
      if(focusId===a.id) setTimeout(()=>row.querySelector("button").click(),50);
      box.appendChild(row);
    });
    c.appendChild(box);
  }

  if(done.length){
    const gaps = done.map(a=> (a.actP+a.actM)/2 - (a.predP+a.predM)/2 );
    const avg = Math.round(gaps.reduce((x,y)=>x+y,0)/gaps.length);
    const box = el(`<div class="card">
      <div class="card-hd"><div><h2>What you actually found</h2>
      <p class="muted" style="margin:0">${avg>3 ? `On average these turned out <b>${avg} points better</b> than you predicted. That gap is the finding — your forecast is biased low, and now you have your own data saying so.`
        : avg<-3 ? `These came in ${Math.abs(avg)} points below prediction on average. Worth checking: are you scheduling things you think you <i>should</i> enjoy rather than things you do?`
        : "Predictions and reality are tracking closely. Try something slightly larger than feels comfortable."}</p></div></div>
    </div>`);
    done.slice(0,8).forEach(a=>{
      const d = Math.round(((a.actP+a.actM)-(a.predP+a.predM))/2);
      box.appendChild(el(`<div class="list-item" style="margin-bottom:8px">
        <div class="spread"><b style="font-weight:600">${esc(a.title)}</b>
        <span class="tag ${d>=0?"calm":"hot"}">${d>=0?"+":""}${d}</span></div>
        <span class="muted">predicted ${Math.round((a.predP+a.predM)/2)} · actual ${Math.round((a.actP+a.actM)/2)}</span>
      </div>`));
    });
    c.appendChild(box);
  }

  if(!S.activities.length){
    c.appendChild(el(`<div class="card flat"><div class="empty">
      <p>Nothing scheduled yet. Start with something so small it feels almost pointless — that's deliberate. The point is to break the wait-until-I-feel-ready rule, not to have a productive day.</p>
    </div></div>`));
  }
  return c;
};

/* ═══ SCREEN: Exposure ══════════════════════════════════ */
SCREENS.expose = ()=>{
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>Exposure ladder</h1>`));
  c.appendChild(el(`<p class="lede">Avoidance works — for about twenty minutes. Then it teaches your nervous system that the thing really was dangerous, and the fear grows. Exposure reverses that, by staying in contact with the feared thing long enough for the alarm to come down on its own.</p>`));

  c.appendChild(el(`<div class="notice">
    <b>How to do a step properly.</b> Stay in it until your rating has dropped by roughly half — usually 20 to 40 minutes, rarely less. Leaving while the number is still high rehearses escape. Don't use safety behaviours (rehearsing every word, gripping something, keeping an exit in view); they let the fear survive the experience intact. Repeat the same step until it bores you, then move up.
  </div>`));

  const mk = el(`<div class="card">
    <h2>Build a ladder</h2>
    <textarea id="fear" rows="1" placeholder="Speaking up in meetings"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="mkb">Create ladder</button>
      <button class="btn ghost" id="aib" data-ai-dep>Draft the steps for me</button>
    </div>
    <div id="mkout" style="margin-top:14px"></div>
  </div>`);
  mk.querySelector("#mkb").onclick = ()=>{
    const name = mk.querySelector("#fear").value.trim(); if(!name) return;
    S.ladders.unshift({id:uid(), name, rungs:[], ts:Date.now()}); save(); go("expose");
  };
  mk.querySelector("#aib").onclick = async ()=>{
    const name = mk.querySelector("#fear").value.trim(); if(!name) return mk.querySelector("#fear").focus();
    const slot = mk.querySelector("#mkout"); slot.innerHTML="";
    if(!AI){ slot.appendChild(el(`<div class="notice" style="margin:0">${esc(aiMsg("not_granted"))} Add the steps by hand below — smallest first.</div>`)); return; }
    slot.appendChild(thinkingEl("Building the ladder…"));
    try{
      const raw = await AI.json(
`A user of a CBT self-help tool wants a graded exposure hierarchy for this fear: "${name}".
Produce 8 steps ordered from easiest to hardest. Each must be a concrete action the person performs, specific enough to know when it is done, and repeatable. No safety behaviours. Distress ratings should climb smoothly from about 15 to about 90.
Reply with ONLY a JSON object of the form {"steps":[{"step":"<action>","suds":<0-100>}]}`);
      slot.innerHTML = "";
      const steps = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.steps) ? raw.steps : null);
      if(steps){
        S.ladders.unshift({id:uid(), name, ts:Date.now(),
          rungs: steps.slice(0,10).map(s=>({id:uid(), text:String(s.step||""), suds:Math.max(0,Math.min(100,+s.suds||50)), trials:[]}))});
        save(); go("expose");
      }
    }catch(err){
      slot.innerHTML="";
      const m = aiMsg(err.code); if(m) slot.appendChild(el(`<div class="notice" style="margin:0">${esc(m)}</div>`));
    }
  };
  c.appendChild(mk);

  S.ladders.forEach(L=>{
    const box = el(`<div class="card"><div class="card-hd">
      <div><h2>${esc(L.name)}</h2>
      <p class="muted" style="margin:0">${L.rungs.filter(r=>r.trials.length).length} of ${L.rungs.length} steps attempted</p></div>
      <button class="btn quiet sm" data-del title="Delete ladder">✕</button></div>
      <div class="rungs"></div>
      <div class="row" style="margin-top:8px">
        <input type="text" placeholder="Add a step" style="flex:1;min-width:160px">
        <button class="btn ghost sm" data-add>Add</button>
      </div>
    </div>`);
    const rw = box.querySelector(".rungs");
    [...L.rungs].sort((a,b)=>a.suds-b.suds).forEach(R=>{
      const doneOk = R.trials.length && R.trials[R.trials.length-1].after <= R.suds/2;
      const row = el(`<div class="ladder-rung ${doneOk?"done":""}">
        <div class="suds">${R.suds}</div>
        <div style="flex:1;min-width:0">${esc(R.text)}
          ${R.trials.length? `<div class="muted">${R.trials.length} attempt${R.trials.length>1?"s":""} · last ${R.trials[R.trials.length-1].before} → ${R.trials[R.trials.length-1].after}</div>`:""}
        </div>
        <button class="btn sm ghost">Log</button></div>`);
      row.querySelector("button").onclick = ()=>{
        const pan = el(`<div class="card flat" style="margin:0 0 10px;background:var(--surface-2)">
          <label class="fl">Distress at the start, and when you stopped</label>
          <div class="a"></div><div class="b"></div>
          <button class="btn sm">Save attempt</button></div>`);
        let bfr=R.suds, aft=Math.round(R.suds/2);
        pan.querySelector(".a").appendChild(slider("At the start", R.suds, v=>bfr=v));
        pan.querySelector(".b").appendChild(slider("When you stopped", Math.round(R.suds/2), v=>aft=v));
        pan.querySelector("button").onclick = ()=>{

SCREENS.progress = ()=>{
  const c = el(`<div></div>`);
  c.appendChild(el(`<h1>Progress</h1>`));
  if(!S.records.length){
    c.appendChild(el(`<div class="card flat"><div class="empty">

    c.querySelector(".empty button").onclick = ()=>go("record");
    return c;
  }
  const recs = [...S.records].reverse();
  const drops = recs.filter(r=>r.after!=null).map(r=>r.before-r.after);
  const avg = drops.length? Math.round(drops.reduce((a,b)=>a+b,0)/drops.length):0;
  const best = drops.length? Math.max(...drops):0;

  c.appendChild(el(`<div class="grid2" style="margin-bottom:18px">
    <div class="stat"><b>${avg}%</b><span>average drop in belief</span></div>
    <div class="stat"><b>${best}%</b><span>largest single shift</span></div>
  </div>`));

  /* belief-shift chart */
  const W=640,H=200,P={t:14,r:12,b:26,l:30};
  const n = recs.length, span = Math.max(1,n-1);
  const x = i => P.l + (i/span)*(W-P.l-P.r);
  const y = v => P.t + (1-v/100)*(H-P.t-P.b);
  const line = (key,col) => recs.map((r,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(r[key]??r.before).toFixed(1)}`).join(" ");
  c.appendChild(el(`<div class="card"><h2>Belief before and after</h2>
    <p class="muted" style="margin-bottom:14px">Each pair is one thought record. The gap between the lines is the work.</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Belief in the thought before and after each record">
      ${[0,25,50,75,100].map(g=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${P.l-7}" y="${y(g)+4}" font-size="10" fill="var(--ink-3)" text-anchor="end">${g}</text>`).join("")}
      <path d="${line("before")}" fill="none" stroke="var(--hot)" stroke-width="2" stroke-linejoin="round"/>
      <path d="${line("after")}" fill="none" stroke="var(--calm)" stroke-width="2" stroke-linejoin="round"/>
      ${recs.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.before)}" r="3" fill="var(--hot)"/>
        <circle cx="${x(i)}" cy="${y(r.after??r.before)}" r="3" fill="var(--calm)"/>`).join("")}
    </svg>
    <div class="dot-key"><span><b style="background:var(--hot)"></b>before</span><span><b style="background:var(--calm)"></b>after</span></div>
  </div>`));

  /* distortion frequency */
  const counts = {};
  S.records.forEach(r=>(r.distortions||[]).forEach(d=>counts[d.id]=(counts[d.id]||0)+1));
  const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(ranked.length){
    const max = ranked[0][1];
    const box = el(`<div class="card"><h2>Your recurring patterns</h2>
      <p class="muted" style="margin-bottom:16px">Most people distort in two or three habitual ways rather than all eleven. Knowing which are yours means you can catch them in the moment instead of an hour later.</p></div>`);
    ranked.forEach(([id,n2])=>{
      const meta = DISTORTIONS.find(d=>d.id===id);
      box.appendChild(el(`<div style="margin-bottom:14px">
        <div class="spread" style="margin-bottom:4px"><b style="font-weight:600;font-size:14.5px">${esc(meta?.name||id)}</b>
        <span class="muted">${n2}×</span></div>
        <div class="belief-bar"><i style="width:${(n2/max*100).toFixed(0)}%"></i></div></div>`));
    });
    c.appendChild(box);
  }

  const hist = el(`<div class="card"><h2>Your records</h2></div>`);
  S.records.slice(0,20).forEach(r=>{
    const item = el(`<div class="list-item">
      <blockquote class="quote" style="font-size:17px;margin-bottom:10px">${esc(r.thought)}</blockquote>
      <div class="spread"><div class="row">
        ${(r.distortions||[]).slice(0,3).map(d=>`<span class="tag">${esc(d.name)}</span>`).join("")}
      </div><span class="muted">${r.before}→${r.after??"—"} · ${fmt(r.ts)}</span></div>
      ${r.reframe? `<p class="serifbody" style="margin:12px 0 0;color:var(--ink-2)">${esc(r.reframe)}</p>`:""}
    </div>`);
    hist.appendChild(item);
  });
  c.appendChild(hist);
  return c;
};

let _uid = 0;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tabBar(tabs, current, onPick){
  const bar = el(`<div class="tabs"></div>`);
  tabs.forEach(([id,name])=>{
    const b = el(`<button class="chip" aria-pressed="${id===current}">${esc(name)}</button>`);
    b.onclick = ()=> onPick(id);
    bar.appendChild(b);
  });
  return bar;
}
function mdLite(t){
  const lines = esc(t).split("\n");
  let html = "", list = null;
  const flush = ()=>{ if(list){ html += `<${list.t}>${list.items.map(x=>`<li>${x}</li>`).join("")}</${list.t}>`; list = null; } };
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(let ln of lines){
    ln = ln.replace(/^#{1,6}\s*/, "");
    const ul = ln.match(/^\s*[-*•]\s+(.*)/), ol = ln.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul){ if(!list || list.t!=="ul"){ flush(); list = {t:"ul",items:[]}; } list.items.push(inline(ul[1])); }
    else if(ol){ if(!list || list.t!=="ol"){ flush(); list = {t:"ol",items:[]}; } list.items.push(inline(ol[1])); }
    else if(!ln.trim()){ flush(); }
    else { flush(); html += `<p>${inline(ln)}</p>`; }
  }
  flush();
  return html;
}

function showIntro(){

  const finish = ()=>{
    S.intro = true; save(); ov.remove();
    document.removeEventListener("keydown", onKey);
    try{ prev && prev.focus && prev.focus(); }catch(e){}
  };
  document.addEventListener("keydown", onKey);
  const slides = [
    ()=> el(`<div class="reveal">
      <p class="eyebrow">The idea behind everything here</p>
      <h1 id="intro-h" style="font-size:clamp(26px,6vw,34px)">When you change the way you think, you change the way you feel.</h1>
      <p class="serifbody" style="margin-top:14px">An upsetting event doesn't hand you a feeling directly. A thought arrives first — fast, harsh, usually unnoticed — and the feeling follows it. Distorted thoughts keep low mood and anxiety going. Learning to catch them and answer back is how their grip loosens.</p>
      <p class="muted" style="margin-bottom:22px">The central insight of cognitive therapy, as taught by Dr. David D. Burns in <i>Feeling Good</i>.</p>
      <div class="row"><button class="btn" data-next>Show me how →</button><button class="btn quiet" data-skip>Skip</button></div></div>`),

      return d;
    }
  ];
  const render = ()=>{
    sheet.innerHTML = "";
    const s = slides[i]();
    sheet.appendChild(s);
    s.querySelector("[data-next]").onclick = ()=>{ if(i < slides.length-1){ i++; render(); } else finish(); };

function spotGame(){
  let items = shuffle(SPOT.slice()), i = 0, score = 0;
  const box = el(`<div class="card"><h2>Spot the distortion</h2>
    <p class="muted" style="margin-bottom:14px">Ten thoughts, one distortion each. Quick practice is the fastest way to start catching them in real life.</p><div data-g></div></div>`);
  const area = box.querySelector("[data-g]");
  const draw = ()=>{
    area.innerHTML = "";
    if(i >= items.length){
      area.appendChild(el(`<div><p class="serifbody" style="margin-bottom:4px">You got ${score} of ${items.length}.</p>
        <p class="muted">${score>=8 ? "You're already spotting them quickly." : "Perfectly normal — several of these overlap. Re-read the ten above, then try again."}</p>
        <button class="btn ghost sm">Play again</button></div>`));
      area.querySelector("button").onclick = ()=>{ items = shuffle(SPOT.slice()); i = 0; score = 0; draw(); };
      return;
    }
    const it = items[i];
    const options = shuffle([it.a].concat(shuffle(TEN.map(t=>t.n).filter(n=>n!==it.a)).slice(0,3)));
    area.appendChild(el(`<div class="qn">${i+1} OF ${items.length}</div>`));
    area.appendChild(el(`<blockquote class="quote">${esc(it.t)}</blockquote>`));
    const wrap = el(`<div class="opts"></div>`);
    const fb = el(`<div style="margin-top:12px"></div>`);
    options.forEach(n=>{
      const b = el(`<button class="opt">${esc(TEN[n-1].name)}</button>`);
      b.onclick = ()=>{
        wrap.querySelectorAll("button").forEach(x=> x.disabled = true);
        const ok = n === it.a;
        if(ok) score++;
        b.classList.add(ok ? "right" : "wrong");
        if(!ok) wrap.querySelectorAll("button").forEach(x=>{ if(x.textContent===TEN[it.a-1].name) x.classList.add("right"); });
        fb.appendChild(el(`<p style="margin:0 0 10px"><b>${ok?"Yes.":"Not quite."}</b> This is <b>${esc(TEN[it.a-1].name)}</b>. ${esc(TEN[it.a-1].fix)}</p>`));
        const nx = el(`<button class="btn sm">${i+1<items.length?"Next":"See score"}</button>`);
        nx.onclick = ()=>{ i++; draw(); };
        fb.appendChild(nx);
      };
      wrap.appendChild(b);
    });
    area.appendChild(wrap); area.appendChild(fb);
  };
  draw();
  return box;
}

function breathingCard(){
  const P = {
    calm:{name:"Calming 4-4-6", ph:[["Breathe in",4,1],["Hold",4,1],["Breathe out",6,.55]]},
    box:{name:"Box 4-4-4-4",  ph:[["Breathe in",4,1],["Hold",4,1],["Breathe out",4,.55],["Hold",4,.55]]}
  };
  const w = el(`<div class="card"><h2>Guided breathing</h2>
    <p class="muted" style="margin-bottom:10px">Follow the circle. A longer breath out than in is what settles the body. Two or three minutes is plenty.</p>
    <div class="row" data-pat></div>
    <div class="breath"><div class="orbwrap"><div class="orb" aria-hidden="true"></div></div><div class="blabel" aria-live="polite">Ready</div></div>
    <div class="row" style="justify-content:center"><button class="btn" data-go>Start</button><span class="muted" data-cnt></span></div></div>`);
  let key = "calm", timer = null, cycles = 0, running = false;
  const orb = w.querySelector(".orb"), lab = w.querySelector(".blabel"), cnt = w.querySelector("[data-cnt]"), btn = w.querySelector("[data-go]");
  const stop = ()=>{
    running = false; clearTimeout(timer); timer = null;
    lab.textContent = "Ready"; orb.style.transitionDuration = ".6s"; orb.style.transform = "scale(.55)"; btn.textContent = "Start";
  };
  const run = idx=>{
    if(!running) return;
    const ph = P[key].ph, cur = ph[idx % ph.length];
    if(idx > 0 && idx % ph.length === 0){ cycles++; cnt.textContent = cycles + (cycles===1?" cycle":" cycles"); }
    lab.textContent = cur[0];
    orb.style.transitionDuration = cur[1] + "s";
    orb.style.transform = "scale(" + cur[2] + ")";
    timer = setTimeout(()=> run(idx+1), cur[1]*1000);
  };
  const pat = w.querySelector("[data-pat]");
  Object.keys(P).forEach(k=>{
    const b = el(`<button class="chip" aria-pressed="${k===key}">${esc(P[k].name)}</button>`);
    b.onclick = ()=>{ key = k; pat.querySelectorAll("button").forEach(x=> x.setAttribute("aria-pressed", String(x===b))); if(running){ stop(); } };
    pat.appendChild(b);
  });
  btn.onclick = ()=>{
    if(running){ stop(); return; }
    running = true; cycles = 0; cnt.textContent = ""; btn.textContent = "Stop";
    orb.style.transitionDuration = "0s"; orb.style.transform = "scale(.55)";
    timer = setTimeout(()=> run(0), 60);
  };
  cleanups.push(stop);
  return w;
}

    const b = el(`<button class="chip" data-id="${d.id}" aria-pressed="false" title="${esc(d.def)}">${esc(d.name)}</button>`);
    b.onclick = ()=>{ t.dist = t.dist.includes(d.id) ? t.dist.filter(x=>x!==d.id) : t.dist.concat(d.id); paint(); };
    chips.appendChild(b);
  });
  paint();
  const rm = row.querySelector("[data-rm]"); if(rm) rm.onclick = onRemove;
  const aiBtn = row.querySelector("[data-ai]"), aiOut = row.querySelector("[data-aiout]");
  aiBtn.onclick = async ()=>{
    if(!t.text.trim()){ text.focus(); return; }
    aiOut.innerHTML = "";
    if(!AI){ aiOut.appendChild(el(`<div class="notice">${esc(aiMsg("not_granted"))}</div>`)); return; }
    aiBtn.disabled = true; aiOut.appendChild(thinkingEl("Reading it…"));
    try{
      const r = await AI.json(
`Inside a CBT journal. The user's automatic thought: "${t.text}"
Distortion ids: ${DISTORTIONS.map(d=>d.id+" = "+d.name).join("; ")}
Reply with ONLY a JSON object: {"distortions":["<id>"],"reframe":"<a truer, kind, first-person version that keeps their facts and acknowledges what actually hurts>","why":"<one plain sentence naming the main distortion and where it shows>"}
Use between one and three distortion ids, exactly as listed.`);
      aiOut.innerHTML = "";
      const ids = (r.distortions||[]).filter(id=> DISTORTIONS.some(d=>d.id===id));
      if(ids.length){ t.dist = ids; paint(); }
      if(r.why) aiOut.appendChild(el(`<p class="muted" style="margin:0 0 8px">${esc(r.why)}</p>`));
      if(r.reframe){
        if(!pos.value.trim()){ pos.value = r.reframe; t.pos = r.reframe; }
        else aiOut.appendChild(el(`<p class="serifbody" style="margin:0 0 8px;color:var(--ink-2)">Suggested: ${esc(r.reframe)}</p>`));
      }
    }catch(err){ aiOut.innerHTML = ""; aiOut.appendChild(aiErrorCard(err)); }
    aiBtn.disabled = false;
  };
  return row;
}

  EMO_LOG.forEach(e=> d.emo[e.id] = {before:0, after:0});
  const c = el(`<div></div>`);

  const c1 = el(`<div class="card"><h2>1 · The upsetting event</h2>
    <p class="muted" style="margin-bottom:10px">Who, what, when, where — just the facts a camera would have caught.</p>
    <textarea rows="2" placeholder="Tuesday's team meeting: my manager moved on without reading my update."></textarea></div>`);
  c1.querySelector("textarea").oninput = e=> d.event = e.target.value;
  c.appendChild(c1);

  const c2 = el(`<div class="card"><h2>2 · How do you feel?</h2>
    <p class="muted" style="margin-bottom:14px">Rate only the feelings that are present, 0 to 100. You'll rate them again at the end.</p><div data-e></div></div>`);

  const c3 = el(`<div class="card"><h2>3 · The thoughts behind the feelings</h2>

    <div data-t></div><button class="btn ghost sm" data-add style="margin-top:6px">+ Add another thought</button></div>`);
  const tl = c3.querySelector("[data-t]");
  const drawRows = ()=>{
    tl.innerHTML = "";
    d.thoughts.forEach((t,i)=> tl.appendChild(thoughtRow(t, i+1, ()=>{ d.thoughts.splice(i,1); drawRows(); })));
    c3.querySelector("[data-add]").hidden = d.thoughts.length >= 4;
  };
  c3.querySelector("[data-add]").onclick = ()=>{ d.thoughts.push(newThought()); drawRows(); };
  drawRows();
  c.appendChild(c3);

  const fin = el(`<div class="card"><h2>4 · Re-rate</h2><div data-after>
    <p class="muted" style="margin-bottom:12px">When you've written your positive thoughts, re-rate how you feel and how much you still believe each original thought.</p>
